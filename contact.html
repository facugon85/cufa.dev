<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUFA · Facundo González</title>
  <link rel="icon" type="image/png" href="img/logo128.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/logo128.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --orange: #ff4d00;
      --orange-dim: #cc3d00;
      --text: #f0ede8;
      --text-muted: #888880;
      --text-dim: #444440;
      --border: rgba(255,255,255,0.07);
      --mono: 'Space Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
      --body: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px 28px 28px;
      text-align: center;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--orange);
      transform: scaleX(0);
      transform-origin: left;
      animation: line-in 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .avatar { animation-delay: 0.15s; }
    h1 { animation-delay: 0.25s; }
    .role { animation-delay: 0.32s; }
    .btn-primary { animation-delay: 0.4s; }
    .links .link:nth-child(1) { animation-delay: 0.46s; }
    .links .link:nth-child(2) { animation-delay: 0.52s; }
    .links .link:nth-child(3) { animation-delay: 0.58s; }
    .links .link:nth-child(4) { animation-delay: 0.64s; }
    footer.dev-credit { animation-delay: 0.7s; }
    @keyframes line-in { to { transform: scaleX(1); } }
    @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 22px;
      object-fit: cover;
      border: 2px solid var(--orange);
      filter: grayscale(1);
    }
    h1 {
      font-family: var(--display);
      font-size: 32px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .role {
      font-family: var(--mono);
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      font-family: var(--mono);
      background: var(--orange);
      color: var(--bg);
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px;
      margin-bottom: 22px;
      transition: background 0.2s;
    }
    .btn-primary:hover, .btn-primary:active { background: var(--orange-dim); }
    .links { display: flex; flex-direction: column; gap: 10px; }
    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: border-color 0.2s;
    }
    .link:hover, .link:active { border-color: var(--orange); }
    .link .ico { font-size: 16px; width: 20px; text-align: center; filter: grayscale(1); }
    footer.dev-credit {
      margin-top: 30px;
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    a.cufa-name {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--orange);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar reveal" src="/img/1cufa.png" alt="Facundo González">
    <h1 class="reveal">Facundo Gonzalez</h1>
    <p class="role reveal">Full Stack Developer &amp; Visual Producer</p>

    <a class="btn-primary reveal" href="/contact.vcf">Guardar contacto</a>

    <div class="links">
      <a class="link reveal" href="https://cufagon.xyz" target="_blank" rel="noopener">
        <span class="ico">🌐</span> cufagon.xyz
      </a>
      <a class="link reveal" href="https://wa.me/5491168980563" target="_blank" rel="noopener">
        <span class="ico">💬</span> WhatsApp
      </a>
      <a class="link reveal" href="https://instagram.com/cufa.dev" target="_blank" rel="noopener">
        <span class="ico">📸</span> Instagram
      </a>
      <a class="link reveal" href="mailto:facundonic.gonzalez@gmail.com">
        <span class="ico">✉️</span> Email
      </a>
    </div>

    <footer class="dev-credit reveal">Hecho con 🧉 en Buenos Aires por <a class="cufa-name" href="https://www.cufagon.xyz/" target="_blank" rel="noopener">CUFA.</a></footer>
  </main>
</body>
</html>
